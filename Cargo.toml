[package]
name = "fireline"
version.workspace = true
edition = "2024"
description = "Reserved name: the interface crates (both sides of each interface) between Fuel and the other ML projects, one crate per interface. Placeholder, no functionality yet."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/fireline"
readme = "README.md"

[workspace]
resolver = "3"
members = [".", "tools/tilde-lint", "crates/announce", "crates/grammar", "crates/synth", "crates/dlpack", "crates/contract"]
# Without this, a bare `cargo test` / `clippy` / `build` covers only the root package and CI would skip every member.
default-members = [".", "tools/tilde-lint", "crates/announce", "crates/grammar", "crates/synth", "crates/dlpack", "crates/contract"]

# The one project version: the root package and every non-interface tool inherit it (`version.workspace = true`), so a bump is one edit and the tools
# cannot drift from it (CodeRipper version-consistency). Interface crates (crates/*) do NOT inherit it: each versions by its own interface.
[workspace.package]
version = "0.0.20"
