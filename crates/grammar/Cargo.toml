[package]
name = "fireline-grammar"
version = "0.2.6"
edition = "2024"
rust-version = "1.88"
description = "The kernel-seam region grammar: OpTag, OpAttrs (with canonical bytes), RegionKey, PatternNode and the shape-expression codec, shared by a kernel consumer and a kernel provider. Types only, no logic, dependency-free."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/fireline"
readme = "README.md"
keywords = ["kernel", "grammar", "wire-format", "ml"]

# Intentionally dependency-free: a synthesizer backend depends on this small crate without pulling a graph layer. The Op -> OpTag
# projection and the structural matcher stay in the consumer (they need its graph).
[dependencies]
